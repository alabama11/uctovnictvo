name: Zostavenie

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Testy
        run: dotnet test

      - name: Zostavenie .exe pre Windows
        run: dotnet publish src/Uctovnictvo.App -c Release -r win-x64 -o publish/Uctovnictvo

      - name: Balík ZIP
        run: |
          VERZIA=$(grep -oP '(?<=<Version>)[^<]+' src/Uctovnictvo.App/Uctovnictvo.App.csproj)
          echo "VERZIA=${VERZIA}" >> "$GITHUB_ENV"
          rm -f publish/Uctovnictvo/*.pdb
          cp CITAJ-MA.txt publish/Uctovnictvo/
          (cd publish && zip -qr "../Uctovnictvo-${VERZIA}-win-x64.zip" Uctovnictvo)
          echo "ZIP=Uctovnictvo-${VERZIA}-win-x64.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Uctovnictvo-win-x64
          path: ${{ env.ZIP }}

      # každý commit do main aktualizuje vydanie podľa verzie v Uctovnictvo.App.csproj
      - name: Vydanie (Release)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERZIA }}
          target_commitish: ${{ github.sha }}
          name: Účtovníctvo ${{ env.VERZIA }}
          files: ${{ env.ZIP }}
          body: |
            **Spustenie:** stiahnite ZIP nižšie (Assets), rozbaľte ho (pravé tlačidlo → Extrahovať všetko…) a spustite `Uctovnictvo.exe`.
            Pri hlásení „Systém Windows ochránil váš počítač“ kliknite na **Ďalšie informácie → Spustiť aj tak**.

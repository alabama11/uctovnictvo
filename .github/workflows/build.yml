name: Zostavenie

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Testy
        run: dotnet test

      - name: Zostavenie .exe pre Windows
        run: dotnet publish src/Uctovnictvo.App -c Release -r win-x64 -o publish/Uctovnictvo

      - name: Balík ZIP
        run: |
          VERZIA="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERZIA="dev-${GITHUB_SHA::7}"
          rm -f publish/Uctovnictvo/*.pdb
          cp CITAJ-MA.txt publish/Uctovnictvo/
          (cd publish && zip -qr "../Uctovnictvo-${VERZIA}-win-x64.zip" Uctovnictvo)
          echo "ZIP=Uctovnictvo-${VERZIA}-win-x64.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Uctovnictvo-win-x64
          path: ${{ env.ZIP }}

      - name: Vydanie (Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          body: |
            **Spustenie:** stiahnite ZIP nižšie (Assets), rozbaľte ho (pravé tlačidlo → Extrahovať všetko…) a spustite `Uctovnictvo.exe`.
            Pri hlásení „Systém Windows ochránil váš počítač“ kliknite na **Ďalšie informácie → Spustiť aj tak**.
